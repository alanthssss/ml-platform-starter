apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: triton
  namespace: argocd
spec:
  project: ml-platform
  source:
    repoURL: https://github.com/alanthssss/ml-platform-starter
    targetRevision: HEAD
    path: platform/triton
  destination:
    server: https://kubernetes.default.svc
    namespace: ml-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
