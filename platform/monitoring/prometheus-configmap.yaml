apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'api-gateway'
        static_configs:
          - targets: ['api-gateway.ml-platform.svc.cluster.local:8080']
        metrics_path: /metrics

      - job_name: 'triton'
        static_configs:
          - targets: ['triton.ml-platform.svc.cluster.local:8002']
        metrics_path: /metrics
