apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources-config
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ''
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-json
  namespace: monitoring
data:
  ml-platform.json: |
    {
      "title": "ML Platform",
      "uid": "ml-platform",
      "schemaVersion": 38,
      "version": 1,
      "panels": [
        {
          "id": 1,
          "title": "API Request Rate",
          "type": "graph",
          "targets": [
            {
              "expr": "rate(api_gateway_requests_total[1m])",
              "legendFormat": "{{endpoint}}"
            }
          ],
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 }
        },
        {
          "id": 2,
          "title": "API Request Latency (p99)",
          "type": "graph",
          "targets": [
            {
              "expr": "histogram_quantile(0.99, rate(api_gateway_request_duration_seconds_bucket[1m]))",
              "legendFormat": "p99 {{endpoint}}"
            }
          ],
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 }
        },
        {
          "id": 3,
          "title": "Triton Request Latency (p99)",
          "type": "graph",
          "targets": [
            {
              "expr": "histogram_quantile(0.99, rate(api_gateway_triton_request_duration_seconds_bucket[1m]))",
              "legendFormat": "p99 triton"
            }
          ],
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 }
        },
        {
          "id": 4,
          "title": "Prediction Count",
          "type": "stat",
          "targets": [
            {
              "expr": "api_gateway_predictions_total",
              "legendFormat": "predictions"
            }
          ],
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 }
        }
      ],
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "30s"
    }
